name: SOL Sentinel Schedule Canary

on:
  schedule:
    - cron: "0,30 * * * *"

permissions:
  actions: read

concurrency:
  group: sol-sentinel-schedule-canary
  cancel-in-progress: false

jobs:
  schedule-probe:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit read-only schedule provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          workflow_file = os.environ["WORKFLOW_REF"].split("/")[-1].split("@", 1)[0]
          api_url = (
              "https://api.github.com/repos/"
              + os.environ["REPOSITORY"]
              + "/actions/workflows/"
              + workflow_file
          )
          request = urllib.request.Request(
              api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=8) as response:
              workflow = json.loads(response.read(256_000).decode("utf-8"))

          record = {
              "mode": "SCHEDULE_CANARY_READ_ONLY",
              "observed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workflow_id": workflow.get("id"),
              "workflow_name": workflow.get("name"),
              "workflow_path": workflow.get("path"),
              "workflow_state": workflow.get("state"),
              "event": os.environ["EVENT_NAME"],
              "branch": os.environ["REF_NAME"],
              "ref": os.environ["REF"],
              "head_sha": os.environ["HEAD_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "run_url": os.environ["RUN_URL"],
              "paper_state_accessed": False,
              "trading_engine_invoked": False,
              "exchange_credentials_accessed": False,
          }
          print("SOL_SENTINEL_SCHEDULER_CANARY=" + json.dumps(record, sort_keys=True))
          if record["event"] != "schedule" or record["branch"] != "main":
              raise SystemExit("canary must be a scheduled event on main")
          if not record["workflow_id"] or record["workflow_state"] != "active":
              raise SystemExit("canary workflow metadata could not be verified")
          PY
