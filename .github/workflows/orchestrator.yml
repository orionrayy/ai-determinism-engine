name: AI Orchestrator

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Goal for the orchestrator"
        required: true
        type: string
      live:
        description: "Enable live tool execution"
        required: false
        default: false
        type: boolean
      approve_high_risk:
        description: "Approve high-risk actions for this run"
        required: false
        default: false
        type: boolean
      max_parallel:
        description: "Maximum independent low-risk nodes to execute concurrently"
        required: false
        default: "4"
        type: string
      federate_safe_agents:
        description: "Enable $0 GitHub Actions matrix federation for independent safe agents"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [orchestrator.event, orchestrator.continue, orchestrator.federation.completed]
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  # Serialize retries/continuations for the exact workflow identity. Issue events
  # are source-ingress only; approvals are translated to repository_dispatch by
  # orchestrator-approval.yml so they use the same workflow_id group.
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.workflow_id || github.event_name == 'issues' && github.event.issue.number || github.event_name == 'schedule' && 'scheduled-recovery' || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  orchestrate:
    if: github.event_name != 'schedule' && (github.event_name != 'issues' || startsWith(github.event.issue.title, '[ORCHESTRATOR]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Authorize source issue trigger
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[ORCHESTRATOR]')
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) exit 0 ;;
            *) echo "Issue author is not authorized to trigger orchestration"; exit 1 ;;
          esac

      - name: Resolve goal
        id: goal
        shell: bash
        env:
          INPUT_GOAL: ${{ inputs.goal }}
          EVENT_GOAL: ${{ github.event.client_payload.goal }}
          EVENT_WORKFLOW_ID: ${{ github.event.client_payload.workflow_id }}
          EVENT_EXECUTION_ID: ${{ github.event.client_payload.execution_id }}
          EVENT_DOMAIN: ${{ github.event.client_payload.domain }}
          EVENT_OPERATION: ${{ github.event.client_payload.operation }}
          EVENT_INTENT_FINGERPRINT: ${{ github.event.client_payload.intent_fingerprint }}
          EVENT_INPUT_DIGEST: ${{ github.event.client_payload.input_digest }}
          EVENT_ATTEMPT: ${{ github.event.client_payload.attempt }}
          EVENT_REQUESTED_MODE: ${{ github.event.client_payload.requested_mode }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_WORKFLOW_ID: ${{ github.event.client_payload.workflow_id }}
        run: |
          set -euo pipefail
          goal="$INPUT_GOAL"
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            case "$ISSUE_TITLE" in
              "[ORCHESTRATOR]"*) goal="$ISSUE_BODY" ;;
              *) echo "Ignoring non-orchestrator issue"; exit 0 ;;
            esac
          fi
          if [ -z "$goal" ]; then goal="$EVENT_GOAL"; fi
          if [ -z "$goal" ] && [ -n "$EVENT_OPERATION" ] && [ -n "$EVENT_DOMAIN" ]; then
            goal="Execute orchestration operation $EVENT_DOMAIN.$EVENT_OPERATION"
          fi
          if [ -z "$goal" ] && [ -n "$GITHUB_EVENT_WORKFLOW_ID" ]; then goal="Continuing workflow $GITHUB_EVENT_WORKFLOW_ID"; fi
          if [ -z "$goal" ] && [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            goal='Run the orchestration health check and report current state.'
          fi
          workflow_id=""
          trigger_issue=""
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            case "$ISSUE_TITLE" in
              "[ORCHESTRATOR]"*)
                if [ "$ISSUE_ACTION" = "labeled" ]; then
                  echo "Ignoring label on a source orchestration issue"; exit 0
                fi
                goal="$ISSUE_BODY"
                trigger_issue="$ISSUE_NUMBER"
                ;;
              *) echo "Ignoring non-orchestrator issue"; exit 0 ;;
            esac
          fi
          printf '%s' "$goal" > /tmp/orchestrator_goal.txt
          {
            echo "goal=$goal"
            echo "issue_number=$trigger_issue"
            echo "workflow_id=$workflow_id"
            echo "execution_id=$EVENT_EXECUTION_ID"
            echo "domain=$EVENT_DOMAIN"
            echo "operation=$EVENT_OPERATION"
            echo "intent_fingerprint=$EVENT_INTENT_FINGERPRINT"
            echo "input_digest=$EVENT_INPUT_DIGEST"
            echo "attempt=$EVENT_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Bootstrap approval labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create orchestrator-approved --description "Approve a high-risk orchestration action" --color 0E8A16 --force
          gh label create orchestrator-rejected --description "Reject a high-risk orchestration action" --color B60205 --force

      - name: Run orchestrator
        env:
          ORCHESTRATOR_GOAL: ${{ steps.goal.outputs.goal }}
          ORCHESTRATOR_LIVE: ${{ inputs.live && 'true' || 'false' }}
          ORCHESTRATOR_APPROVE_HIGH_RISK: ${{ inputs.approve_high_risk && 'true' || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ORCHESTRATOR_WEBHOOK_URL: ${{ secrets.ORCHESTRATOR_WEBHOOK_URL }}
          ORCHESTRATOR_WEBHOOK_SECRET: ${{ secrets.ORCHESTRATOR_WEBHOOK_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ORCHESTRATOR_RESEARCH_URL: ${{ secrets.ORCHESTRATOR_RESEARCH_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          ORCHESTRATOR_RESUME: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          ORCHESTRATOR_ISSUE: ${{ github.event_name == 'issues' && 'true' || 'false' }}
          ORCHESTRATOR_EVENT_WORKFLOW_ID: ${{ github.event.client_payload.workflow_id }}
          ORCHESTRATOR_EVENT_ID: ${{ github.event.client_payload.event_id }}
          ORCHESTRATOR_EXECUTION_ID: ${{ github.event.client_payload.execution_id }}
          ORCHESTRATOR_EXTERNAL_WORKFLOW_ID: ${{ github.event.client_payload.workflow_id }}
          ORCHESTRATOR_EXTERNAL_DOMAIN: ${{ github.event.client_payload.domain }}
          ORCHESTRATOR_EXTERNAL_OPERATION: ${{ github.event.client_payload.operation }}
          ORCHESTRATOR_INTENT_FINGERPRINT: ${{ github.event.client_payload.intent_fingerprint }}
          ORCHESTRATOR_INPUT_DIGEST: ${{ github.event.client_payload.input_digest }}
          ORCHESTRATOR_EXTERNAL_ATTEMPT: ${{ github.event.client_payload.attempt || '1' }}
          ORCHESTRATOR_REQUESTED_MODE: ${{ github.event.client_payload.requested_mode || 'dry-run' }}
          ORCHESTRATOR_CALLBACK_URL: ${{ secrets.ORCHESTRATOR_CALLBACK_URL }}
          ORCHESTRATOR_CALLBACK_SECRET: ${{ secrets.ORCHESTRATOR_CALLBACK_SECRET }}
          ORCHESTRATOR_TARGET_WORKFLOW_ID: ${{ steps.goal.outputs.workflow_id }}
          ORCHESTRATOR_TRIGGER_ISSUE: ${{ steps.goal.outputs.issue_number }}
          ORCHESTRATOR_GITHUB_RUN_ID: ${{ github.run_id }}
          ORCHESTRATOR_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          ORCHESTRATOR_FREE_ONLY: "true"
          ORCHESTRATOR_MAX_PARALLEL: ${{ inputs.max_parallel || '4' }}
          ORCHESTRATOR_MAX_ATTEMPTS: ${{ vars.ORCHESTRATOR_MAX_ATTEMPTS || '64' }}
          ORCHESTRATOR_DURABILITY_BARRIER: "true"
          ORCHESTRATOR_FEDERATION_ENABLED: ${{ inputs.federate_safe_agents && 'true' || vars.ORCHESTRATOR_FEDERATION_ENABLED || 'false' }}
          ORCHESTRATOR_FEDERATION_ARTIFACT_ID: ${{ github.event.client_payload.artifact_id }}
          ORCHESTRATOR_FEDERATION_ARTIFACT_DIGEST: ${{ github.event.client_payload.artifact_digest }}
          ORCHESTRATOR_FEDERATION_ID: ${{ github.event.client_payload.federation_id }}
        run: |
          if [ "$ORCHESTRATOR_RESUME" = "true" ]; then
            args=(--resume --step)
          elif [ -n "$ORCHESTRATOR_TARGET_WORKFLOW_ID" ]; then
            args=(--workflow-id "$ORCHESTRATOR_TARGET_WORKFLOW_ID" --step)
          elif [ -n "$ORCHESTRATOR_EVENT_WORKFLOW_ID" ]; then
            args=(--workflow-id "$ORCHESTRATOR_EVENT_WORKFLOW_ID" --step)
          else
            args=(--goal "$ORCHESTRATOR_GOAL" --step)
          fi
          if [ "$ORCHESTRATOR_REQUESTED_MODE" = "live" ]; then args+=(--live); fi
          if [ "$ORCHESTRATOR_APPROVE_HIGH_RISK" = "true" ]; then args+=(--approve-high-risk); fi
          python3 orchestrator/orchestrator.py "${args[@]}"

      - name: Persist state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .orchestrator
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(orchestrator): persist workflow state"

          # A human merge or another non-orchestrator writer may advance main while
          # this runner is executing. Rebase the state commit onto fresh main and
          # retry the fast-forward push a bounded number of times. Conflicts fail
          # closed instead of overwriting a concurrent state writer.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "State persistence rebase conflict; refusing to overwrite concurrent main state."
              exit 1
            fi
            sleep $((attempt * 2))
          done

          echo "State persistence push failed after bounded retries."
          exit 1

      - name: Job summary
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            "## AI Orchestrator" \
            "" \
            "- Goal: $(cat /tmp/orchestrator_goal.txt)" \
            "- Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .orchestrator/state.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open(".orchestrator/state.json"))
          wf=s.get("workflows",{}).get(s.get("last_workflow_id"))
          print(f"- Workflow: `{wf['id']}`" if wf else "- Workflow: n/a")
          print(f"- Status: **{wf['status']}**" if wf else "- Status: n/a")
          PY
          fi

  schedule-recovery:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30eaf803
        with:
          ref: main
          fetch-depth: 1
      - name: Dispatch stale workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SCHEDULE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          state_path = Path(".orchestrator/state.json")
          if not state_path.exists():
              print("dispatched=0")
              raise SystemExit(0)
          state = json.loads(state_path.read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)

          def stale_running(workflow):
              raw = str(workflow.get("updated_at") or "")
              if not raw:
                  return True
              try:
                  updated = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              except ValueError:
                  return True
              if updated.tzinfo is None:
                  updated = updated.replace(tzinfo=timezone.utc)
              return (now - updated).total_seconds() >= 300

          def barrier_failed(workflow):
              executions = workflow.get("executions")
              if not isinstance(executions, dict):
                  return False
              for node in workflow.get("nodes", []):
                  if not isinstance(node, dict) or node.get("status") != "failed":
                      continue
                  if not isinstance(node.get("id"), str):
                      continue
                  key = hashlib.sha256(
                      f"{workflow.get('id')}:{node['id']}".encode("utf-8")
                  ).hexdigest()
                  record = executions.get(key)
                  if isinstance(record, dict) and record.get("status") == "barrier_failed":
                      return True
              return False

          dispatched = 0
          for workflow in state.get("workflows", {}).values():
              if not isinstance(workflow, dict):
                  continue
              workflow_id = str(workflow.get("id") or "").strip()
              if not workflow_id:
                  continue
              status = workflow.get("status")
              federation = workflow.get("federation") or {}
              uncertain = any(
                  isinstance(node, dict)
                  and node.get("status") == "failed"
                  and isinstance(node.get("error"), dict)
                  and node["error"].get("execution_uncertain")
                  and node.get("tool") == "connector_bridge"
                  for node in workflow.get("nodes", [])
              )
              candidate = (
                  status == 'waiting_approval'
                  or (status == 'running' and stale_running(workflow))
                  or (status == 'waiting_agents' and federation.get('status') in {'prepared', 'dispatched'})
                  or (status == 'failed' and (uncertain or barrier_failed(workflow)))
              )
              if not candidate:
                  continue
              event_id = "scheduled-recovery:" + workflow_id + ":" + str(workflow.get("updated_at") or "")
              payload = {
                  "event_type": "orchestrator.continue",
                  "client_payload": {
                      "workflow_id": workflow_id,
                      "event_id": event_id,
                      "scheduled_recovery": True,
                      "schedule_run_id": os.environ["SCHEDULE_RUN_ID"],
                  },
              }
              subprocess.run(
                  ["gh", "api", f"repos/{os.environ['REPOSITORY']}/dispatches", "--input", "-"],
                  input=json.dumps(payload),
                  text=True,
                  check=True,
              )
              dispatched += 1
          print(f"dispatched={dispatched}")
          PY
