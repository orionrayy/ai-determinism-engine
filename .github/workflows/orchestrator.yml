name: AI Orchestrator

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Goal for the orchestrator"
        required: true
        type: string
      live:
        description: "Enable live tool execution"
        required: false
        default: false
        type: boolean
      approve_high_risk:
        description: "Approve high-risk actions for this run"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [orchestrator.event, orchestrator.continue]
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-orchestrator
  cancel-in-progress: false
  queue: max

jobs:
  orchestrate:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[ORCHESTRATOR]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authorize source issue trigger
        if: github.event_name == 'issues' && !startsWith(github.event.issue.title, '[ORCHESTRATOR APPROVAL]')
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) exit 0 ;;
            *) echo "Issue author is not authorized to trigger orchestration"; exit 1 ;;
          esac

      - name: Authorize approval actor
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[ORCHESTRATOR APPROVAL]') && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || true)"
          case "$permission" in
            admin|maintain|push|triage) ;;
            *) echo "Actor lacks repository permission to approve orchestration"; exit 1 ;;
          esac
      - name: Resolve goal
        id: goal
        shell: bash
        env:
          INPUT_GOAL: ${{ inputs.goal }}
          EVENT_GOAL: ${{ github.event.client_payload.goal }}
          EVENT_WORKFLOW_ID: ${{ github.event.client_payload.workflow_id }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_LABEL: ${{ github.event.label.name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_WORKFLOW_ID: ${{ github.event.client_payload.workflow_id }}
        run: |
          set -euo pipefail
          goal="$INPUT_GOAL"
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            case "$ISSUE_TITLE" in
              "[ORCHESTRATOR]"*) goal="$ISSUE_BODY" ;;
              *) echo "Ignoring non-orchestrator issue"; exit 0 ;;
            esac
          fi
          if [ -z "$goal" ]; then goal="$EVENT_GOAL"; fi
          if [ -z "$goal" ] && [ -n "$GITHUB_EVENT_WORKFLOW_ID" ]; then goal="Continuing workflow $GITHUB_EVENT_WORKFLOW_ID"; fi
          if [ -z "$goal" ] && [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            goal='Run the orchestration health check and report current state.'
          fi
          workflow_id=""
          trigger_issue=""
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            case "$ISSUE_TITLE" in
              "[ORCHESTRATOR APPROVAL]"*)
                meta="${ISSUE_TITLE#"[ORCHESTRATOR APPROVAL] "}"
                workflow_id="${meta%% / *}"
                if [ "$ISSUE_ACTION" = "labeled" ]; then
                  case "$ISSUE_LABEL" in
                    orchestrator-approved|orchestrator-rejected) ;;
                    *) echo "Ignoring unrelated label"; exit 0 ;;
                  esac
                fi
                goal="Resume workflow $workflow_id after approval state change."
                ;;
              "[ORCHESTRATOR]"*)
                if [ "$ISSUE_ACTION" = "labeled" ]; then
                  echo "Ignoring label on a source orchestration issue"; exit 0
                fi
                goal="$ISSUE_BODY"
                trigger_issue="$ISSUE_NUMBER"
                ;;
              *) echo "Ignoring non-orchestrator issue"; exit 0 ;;
            esac
          fi
          printf '%s' "$goal" > /tmp/orchestrator_goal.txt
          echo "goal=$goal" >> "$GITHUB_OUTPUT"
          echo "issue_number=$trigger_issue" >> "$GITHUB_OUTPUT"
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"

      - name: Bootstrap approval labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create orchestrator-approved --description "Approve a high-risk orchestration action" --color 0E8A16 --force
          gh label create orchestrator-rejected --description "Reject a high-risk orchestration action" --color B60205 --force

      - name: Run orchestrator
        env:
          ORCHESTRATOR_GOAL: ${{ steps.goal.outputs.goal }}
          ORCHESTRATOR_LIVE: ${{ inputs.live && 'true' || 'false' }}
          ORCHESTRATOR_APPROVE_HIGH_RISK: ${{ inputs.approve_high_risk && 'true' || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ORCHESTRATOR_WEBHOOK_URL: ${{ secrets.ORCHESTRATOR_WEBHOOK_URL }}
          ORCHESTRATOR_WEBHOOK_SECRET: ${{ secrets.ORCHESTRATOR_WEBHOOK_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ORCHESTRATOR_RESEARCH_URL: ${{ secrets.ORCHESTRATOR_RESEARCH_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          ORCHESTRATOR_RESUME: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          ORCHESTRATOR_ISSUE: ${{ github.event_name == 'issues' && 'true' || 'false' }}
          ORCHESTRATOR_EVENT_WORKFLOW_ID: ${{ github.event.client_payload.workflow_id }}
          ORCHESTRATOR_TARGET_WORKFLOW_ID: ${{ steps.goal.outputs.workflow_id }}
          ORCHESTRATOR_TRIGGER_ISSUE: ${{ steps.goal.outputs.issue_number }}
          ORCHESTRATOR_GITHUB_RUN_ID: ${{ github.run_id }}
          ORCHESTRATOR_FREE_ONLY: "true"
        run: |
          if [ "$ORCHESTRATOR_RESUME" = "true" ]; then
            args=(--resume --step)
          elif [ -n "$ORCHESTRATOR_TARGET_WORKFLOW_ID" ]; then
            args=(--workflow-id "$ORCHESTRATOR_TARGET_WORKFLOW_ID" --step)
          elif [ -n "$ORCHESTRATOR_EVENT_WORKFLOW_ID" ]; then
            args=(--workflow-id "$ORCHESTRATOR_EVENT_WORKFLOW_ID" --step)
          else
            args=(--goal "$ORCHESTRATOR_GOAL" --step)
          fi
          if [ "$ORCHESTRATOR_LIVE" = "true" ]; then args+=(--live); fi
          if [ "$ORCHESTRATOR_APPROVE_HIGH_RISK" = "true" ]; then args+=(--approve-high-risk); fi
          python3 orchestrator/orchestrator.py "${args[@]}"

      - name: Persist state
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .orchestrator
          git diff --cached --quiet || git commit -m "chore(orchestrator): persist workflow state"
          git push

      - name: Job summary
        if: always()
        shell: bash
        run: |
          echo "## AI Orchestrator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Goal: `$(cat /tmp/orchestrator_goal.txt)`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: `$GITHUB_REPOSITORY`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .orchestrator/state.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
import json
s=json.load(open(".orchestrator/state.json"))
wf=s.get("workflows",{}).get(s.get("last_workflow_id"))
print(f"- Workflow: `{wf['id']}`" if wf else "- Workflow: n/a")
print(f"- Status: **{wf['status']}**" if wf else "- Status: n/a")
PY
          fi
