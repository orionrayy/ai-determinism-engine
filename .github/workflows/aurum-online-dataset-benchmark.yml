name: Aurum Online Dataset Benchmark

on:
  pull_request:
    paths:
      - "projects/aurum-intelligence/online-benchmark/**"
      - "projects/aurum-intelligence/temporal-calibration-v1.3/**"
      - "projects/aurum-intelligence/V1_3_1_IMPLEMENTATION_CHECKPOINT.md"
      - "projects/aurum-intelligence/ONLINE_MULTI_SOURCE_BENCHMARK.md"
      - ".github/workflows/aurum-online-dataset-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurum-online-dataset-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  online-dataset-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Test temporal calibration component and validate 240 scenarios
        working-directory: projects/aurum-intelligence/temporal-calibration-v1.3
        run: |
          python -m unittest -v
          python run_calibration_contracts.py > /tmp/aurum-calibration-contracts.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/aurum-calibration-contracts.json').read_text(encoding='utf-8'))
          assert result['status'] == 'PASS', result
          assert result['scenario_count'] == 240 and result['passed'] == 240 and result['failed'] == 0, result
          assert result['synthetic_only'] is True, result
          assert result['deployment_calibrated'] is False and result['live_signal_enabled'] is False, result
          print(json.dumps(result, indent=2))
          PY
      - name: Unit-test parser, baselines and scenario contracts
        working-directory: projects/aurum-intelligence/online-benchmark
        run: python -m unittest discover -p 'test*.py' -v
      - name: Acquire current community dataset and benchmark
        run: >-
          python projects/aurum-intelligence/online-benchmark/ci_benchmark.py
          --output-dir /tmp/aurum-online-benchmark
          --cases 50 --scenario-anchors 5 --min-rows 1000
      - name: Enforce live data and test-count requirements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/aurum-online-benchmark/online_dataset_benchmark.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['status'] == 'PASS', r
          assert r['dataset']['rows'] >= 1000, r['dataset']
          assert r['real_case_benchmark']['cases'] >= 50, r['real_case_benchmark']
          assert r['real_case_benchmark']['evaluations'] >= 250, r['real_case_benchmark']
          full = r['full_history_replay']
          assert full['decision_opportunities'] == r['dataset']['rows'] - full['warmup_bars'] - 1, full
          assert len(full['chronological_folds']) == 5, full
          assert sum(f['opportunities'] for f in full['chronological_folds']) == full['decision_opportunities'], full
          assert set(full['rules']) == {'last_return_sign', 'ema5_vs_ema10', 'mean_reversion_z10', 'prior20_range_breakout', 'flat_no_trade'}, full
          prob = r['prequential_probability_diagnostics']
          assert prob['status'] == 'DIAGNOSTIC_ONLY', prob
          assert prob['predictions'] == r['dataset']['rows'] - 60 - 1, prob
          assert not prob['validated_model'] and not prob['calibrated_model'], prob
          assert len(prob['methods']) == 3, prob
          for method in prob['methods'].values():
              assert method['n'] == prob['predictions'], method
              assert method['reliability']['ece_descriptive'] is not None, method
              assert method['reliability']['mce_descriptive'] is not None, method
          assert r['scenarios']['market_paths'] >= 200, r['scenarios']
          assert r['scenarios']['market_failed'] == 0, r['scenarios']
          assert r['scenarios']['software_scenarios'] >= 200, r['scenarios']
          assert r['scenarios']['software_failed'] == 0, r['scenarios']
          assert r['decision_output'] == 'NO_TRADE', r['decision_output']
          print(json.dumps({
              'status': r['status'],
              'dataset_rows': r['dataset']['rows'],
              'dataset_sha256': r['source']['sha256'],
              'real_cases': r['real_case_benchmark']['cases'],
              'baseline_evaluations': r['real_case_benchmark']['evaluations'],
              'full_history_decisions_per_rule': r['full_history_replay']['decision_opportunities'],
              'chronological_folds': len(r['full_history_replay']['chronological_folds']),
              'prequential_probability_predictions': r['prequential_probability_diagnostics']['predictions'],
              'probability_diagnostics_status': r['prequential_probability_diagnostics']['status'],
              'market_paths': r['scenarios']['market_paths'],
              'market_passed': r['scenarios']['market_passed'],
              'software_scenarios': r['scenarios']['software_scenarios'],
              'software_passed': r['scenarios']['software_passed'],
              'decision_output': r['decision_output']}, indent=2))
          PY
      - name: Fetch and benchmark multiple public market datasets separately
        run: >-
          python projects/aurum-intelligence/online-benchmark/multi_source_benchmark.py
          --output-dir /tmp/aurum-multi-source-benchmark
          --cases 50 --min-total-rows 100000
      - name: Enforce multi-source evidence and safety contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/aurum-multi-source-benchmark/multi_source_dataset_benchmark.json')
          result = json.loads(path.read_text(encoding='utf-8'))
          assert result['status'] == 'PASS', result
          assert result['source_count'] == 3, result
          assert result['dataset_rows_sum_not_deduplicated'] >= 100000, result
          assert result['real_data_rule_comparisons'] >= 750, result
          assert result['synthetic_market_path_contracts'] >= 2000, result
          assert result['synthetic_software_contracts'] >= 600, result
          assert result['decision_output'] == 'NO_TRADE', result
          assert result['predictive_model_validated'] is False, result
          assert result['model_calibrated_for_deployment'] is False, result
          assert result['live_signal_enabled'] is False, result
          assert result['live_order_execution_enabled'] is False, result
          overlap = result['overlap_concordance'][0]
          assert overlap['exact_timestamp_matches'] >= 1000, overlap
          assert overlap['datasets_merged'] is False, overlap
          assert overlap['independence_status'].startswith('UNVERIFIED'), overlap
          price_diag = overlap['price_level_diagnostics']
          assert len(price_diag['monthly_diagnostics']) >= 2, price_diag
          assert sum(item['matched_timestamps'] for item in price_diag['monthly_diagnostics']) == overlap['exact_timestamp_matches'], price_diag
          assert len(price_diag['representative_paired_candles']) == 5, price_diag
          assert abs(price_diag['signed_close_delta_median_b_minus_a']) > 0, price_diag
          assert set(price_diag['ohlc_signed_delta_median_b_minus_a']) == {'open', 'high', 'low', 'close'}, price_diag
          alignment = overlap['temporal_alignment_probe']
          assert alignment['automatic_timestamp_shifting'] is False, alignment
          assert 0 in alignment['tested_offsets_seconds'], alignment
          assert len(alignment['results']) == len(alignment['tested_offsets_seconds']), alignment
          assert alignment['diagnosis'] in {'POSSIBLE_TIMESTAMP_LABEL_OR_TIMEZONE_SHIFT', 'NO_OBVIOUS_BOUNDED_SHIFT_FIX'}, alignment
          if alignment['diagnosis'] == 'NO_OBVIOUS_BOUNDED_SHIFT_FIX':
              assert alignment['material_shift_candidate'] is False, alignment
              assert alignment['best_offset_seconds_diagnostic_only'] is None, alignment
              assert alignment['relative_median_improvement_fraction'] < 0.2, alignment
          else:
              assert alignment['material_shift_candidate'] is True, alignment
              assert alignment['best_offset_seconds_diagnostic_only'] != 0, alignment
          compatibility = overlap['close_relative_delta']['compatibility_status']
          assert compatibility in {'COMPARABLE', 'DIVERGENT'}, overlap
          assert result['cross_source_compatibility_status'] == compatibility, result
          assert result['cross_source_confirmation_allowed'] is False, result
          assert result['production_ready'] is False, result
          for source in result['sources']:
              assert source['status'] == 'PASS', source
              assert len(source['source']['sha256']) == 64, source
              assert source['real_data_benchmark']['rule_comparisons'] >= 150, source
              assert source['source']['source_timezone_verified'] is False, source
              assert source['source']['broker_provenance_verified'] is False, source
              assert source['predictive_model_validated'] is False, source
              assert source['decision_output'] == 'NO_TRADE', source
          print(json.dumps({
              'status': result['status'],
              'source_count': result['source_count'],
              'dataset_rows_sum_not_deduplicated': result['dataset_rows_sum_not_deduplicated'],
              'real_data_rule_comparisons': result['real_data_rule_comparisons'],
              'synthetic_market_path_contracts': result['synthetic_market_path_contracts'],
              'synthetic_software_contracts': result['synthetic_software_contracts'],
              'cross_source_exact_timestamp_matches': overlap['exact_timestamp_matches'],
              'cross_source_price_compatibility': compatibility,
              'median_signed_close_delta_b_minus_a': price_diag['signed_close_delta_median_b_minus_a'],
              'mean_signed_close_delta_b_minus_a': price_diag['signed_close_delta_mean_b_minus_a'],
              'fraction_source_b_above_source_a': price_diag['fraction_source_b_close_above_source_a'],
              'monthly_diagnostic_buckets': len(price_diag['monthly_diagnostics']),
              'representative_paired_candles': len(price_diag['representative_paired_candles']),
              'median_relative_close_delta': overlap['close_relative_delta']['median_fraction'],
              'p95_relative_close_delta': overlap['close_relative_delta']['p95_fraction'],
              'alignment_diagnosis': alignment['diagnosis'],
              'material_shift_candidate': alignment['material_shift_candidate'],
              'best_timestamp_offset_seconds_diagnostic_only': alignment['best_offset_seconds_diagnostic_only'],
              'best_observed_timestamp_offset_seconds_diagnostic_only': alignment['best_observed_offset_seconds_diagnostic_only'],
              'timestamp_offset_relative_median_improvement': alignment['relative_median_improvement_fraction'],
              'best_relative_close_delta_median': alignment['best_median_relative_delta_fraction'],
              'cross_source_confirmation_allowed': result['cross_source_confirmation_allowed'],
              'decision_output': result['decision_output'],
              'runtime_ms': result['runtime_ms'],
          }, indent=2))
          PY
      - name: Add benchmark report to job summary
        if: always()
        run: |
          if [ -f /tmp/aurum-calibration-contracts.json ]; then
            echo "## Temporal calibration contract benchmark (synthetic only)" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/aurum-calibration-contracts.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/aurum-online-benchmark/online_dataset_benchmark.md ]; then
            cat /tmp/aurum-online-benchmark/online_dataset_benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/aurum-multi-source-benchmark/multi_source_dataset_benchmark.md ]; then
            cat /tmp/aurum-multi-source-benchmark/multi_source_dataset_benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit and replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurum-online-dataset-benchmark-${{ github.run_id }}
          path: |
            /tmp/aurum-online-benchmark/
            /tmp/aurum-calibration-contracts.json
            /tmp/aurum-multi-source-benchmark/multi_source_dataset_benchmark.json
            /tmp/aurum-multi-source-benchmark/multi_source_dataset_benchmark.md
          if-no-files-found: warn
          retention-days: 14
