name: Aurum Online Dataset Benchmark

on:
  pull_request:
    paths:
      - "projects/aurum-intelligence/online-benchmark/**"
      - "projects/aurum-intelligence/temporal-calibration-v1.3/**"
      - "projects/aurum-intelligence/V1_3_1_IMPLEMENTATION_CHECKPOINT.md"
      - ".github/workflows/aurum-online-dataset-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurum-online-dataset-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  online-dataset-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install bounded Parquet reader for CC-BY tick audit
        run: >-
          python -m pip install --disable-pip-version-check --no-warn-script-location
          "pandas==2.2.3" "pyarrow==21.0.0"
      - name: Test temporal calibration component and validate 240 scenarios
        working-directory: projects/aurum-intelligence/temporal-calibration-v1.3
        run: |
          python -m unittest -v
          python run_calibration_contracts.py > /tmp/aurum-calibration-contracts.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/aurum-calibration-contracts.json').read_text(encoding='utf-8'))
          assert result['status'] == 'PASS', result
          assert result['scenario_count'] == 240 and result['passed'] == 240 and result['failed'] == 0, result
          assert result['synthetic_only'] is True, result
          assert result['deployment_calibrated'] is False and result['live_signal_enabled'] is False, result
          print(json.dumps(result, indent=2))
          PY
      - name: Unit-test parser, baselines and scenario contracts
        working-directory: projects/aurum-intelligence/online-benchmark
        run: python -m unittest -v
      - name: Acquire current community dataset and benchmark
        run: >-
          python projects/aurum-intelligence/online-benchmark/ci_benchmark.py
          --output-dir /tmp/aurum-online-benchmark
          --cases 50 --scenario-anchors 5 --min-rows 1000
      - name: Audit third-source public Bid/Ask tick dataset
        run: >-
          python projects/aurum-intelligence/online-benchmark/tick_bidask_benchmark_v1_0.py
          --output-dir /tmp/aurum-online-benchmark
      - name: Enforce live data and test-count requirements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/aurum-online-benchmark/online_dataset_benchmark.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['status'] == 'PASS', r
          assert r['dataset']['rows'] >= 1000, r['dataset']
          assert r['real_case_benchmark']['cases'] >= 50, r['real_case_benchmark']
          assert r['real_case_benchmark']['evaluations'] >= 250, r['real_case_benchmark']
          full = r['full_history_replay']
          assert full['decision_opportunities'] == r['dataset']['rows'] - full['warmup_bars'] - 1, full
          assert len(full['chronological_folds']) == 5, full
          assert sum(f['opportunities'] for f in full['chronological_folds']) == full['decision_opportunities'], full
          assert set(full['rules']) == {'last_return_sign', 'ema5_vs_ema10', 'mean_reversion_z10', 'prior20_range_breakout', 'flat_no_trade'}, full
          prob = r['prequential_probability_diagnostics']
          assert prob['status'] == 'DIAGNOSTIC_ONLY', prob
          assert prob['predictions'] == r['dataset']['rows'] - 60 - 1, prob
          assert not prob['validated_model'] and not prob['calibrated_model'], prob
          assert len(prob['methods']) == 3, prob
          for method in prob['methods'].values():
              assert method['n'] == prob['predictions'], method
              assert method['reliability']['ece_descriptive'] is not None, method
              assert method['reliability']['mce_descriptive'] is not None, method
          assert r['scenarios']['market_paths'] >= 200, r['scenarios']
          assert r['scenarios']['market_failed'] == 0, r['scenarios']
          assert r['scenarios']['software_scenarios'] >= 200, r['scenarios']
          assert r['scenarios']['software_failed'] == 0, r['scenarios']
          assert r['decision_output'] == 'NO_TRADE', r['decision_output']
          cross = r['secondary_source_crosscheck']
          assert cross['status'] in {'CROSS_SOURCE_DIAGNOSTIC_ONLY', 'SOURCE_DISAGREEMENT_REVIEW_REQUIRED'}, cross
          assert cross['common_timestamps'] >= 1000, cross
          lag = cross['timestamp_offset_sensitivity']
          assert lag['automatically_shifted_source_timestamps'] is False and lag['automatically_promoted_source'] is False, lag
          assert lag['max_abs_offset_bars'] == 12 and lag['offsets_tested_bars'] == list(range(-12, 13)), lag
          assert len(lag['results']) == 25, lag
          assert isinstance(lag['best_candidate_at_scan_boundary'], bool), lag
          assert 0.0 <= lag['relative_median_discrepancy_reduction_vs_zero_offset'] <= 1.0, lag
          if cross['status'] == 'SOURCE_DISAGREEMENT_REVIEW_REQUIRED':
              assert cross['source_disagreement_screen']['material_disagreement_flag'] is True, cross
          else:
              assert cross['source_disagreement_screen']['material_disagreement_flag'] is False, cross
          assert cross['reference_only'] is True and cross['provider_provenance_independently_verified'] is False, cross
          tp = r['tp_sl_evaluation_protocol']
          assert tp['protocol_version'] == '1.4.0', tp
          assert tp['status'] == 'DIAGNOSTIC_ONLY', tp
          assert tp['eligible_decisions'] == r['dataset']['rows'] - 12 - 60, tp
          assert tp['candidate_trade_events'] > 0, tp
          assert tp['decision_output'] == 'NO_TRADE' and not tp['live_signal_enabled'], tp
          assert set(tp['chronological_partitions']) == {'development', 'calibration', 'final_holdout'}, tp
          assert tp['chronological_partitions']['calibration']['end_index_exclusive'] == tp['chronological_partitions']['final_holdout']['start_index'], tp
          print(json.dumps({
              'status': r['status'],
              'dataset_rows': r['dataset']['rows'],
              'dataset_sha256': r['source']['sha256'],
              'real_cases': r['real_case_benchmark']['cases'],
              'baseline_evaluations': r['real_case_benchmark']['evaluations'],
              'full_history_decisions_per_rule': r['full_history_replay']['decision_opportunities'],
              'chronological_folds': len(r['full_history_replay']['chronological_folds']),
              'prequential_probability_predictions': r['prequential_probability_diagnostics']['predictions'],
              'probability_diagnostics_status': r['prequential_probability_diagnostics']['status'],
              'market_paths': r['scenarios']['market_paths'],
              'market_passed': r['scenarios']['market_passed'],
              'software_scenarios': r['scenarios']['software_scenarios'],
              'software_passed': r['scenarios']['software_passed'],
              'secondary_source_status': cross['status'],
              'secondary_common_timestamps': cross['common_timestamps'],
              'secondary_close_difference_p95_bps': cross['absolute_close_difference_basis_points']['p95'],
              'secondary_return_correlation': cross['one_bar_return_correlation'],
              'secondary_best_timestamp_offset_bars': lag['best_candidate_offset']['secondary_timestamp_offset_bars_for_diagnostic_only'],
              'secondary_offset_reduction_fraction': lag['relative_median_discrepancy_reduction_vs_zero_offset'],
              'secondary_potential_timestamp_alignment_mismatch': lag['potential_timestamp_alignment_mismatch'],
              'secondary_best_offset_at_scan_boundary': lag['best_candidate_at_scan_boundary'],
              'tp_sl_protocol_status': tp['status'],
              'tp_sl_candidate_trade_events': tp['candidate_trade_events'],
              'tp_sl_scored_binary_events': tp['scored_binary_events'],
              'tp_sl_ambiguous_same_bar_events': tp['ambiguous_same_bar_events'],
              'decision_output': r['decision_output']}, indent=2))
          PY
      - name: Run real OHLCV through integrated Serevex stages 1-3
        working-directory: projects/aurum-intelligence/online-benchmark
        run: |
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          import ci_benchmark
          import serevex_forecast_ledger_producer_v1 as producer
          import serevex_stage123_integrated_v1 as integrated
          import serevex_probability_evolution_v4_v9 as probability_evolution
          import serevex_baseline_advantage_v0_v5 as baseline_advantage
          import serevex_hierarchical_shrinkage_v1 as hierarchical_shrinkage
          import serevex_hierarchical_shrinkage_v2 as hierarchical_shrinkage_v2
          import serevex_baseline_refinement_v0_1a_v5_0a as baseline_refinement

          payload = ci_benchmark.fetch()
          rows = ci_benchmark.parse_csv(payload)
          first_ts = rows[0]["timestamp"]
          naive = first_ts.tzinfo is None or first_ts.utcoffset() is None
          timestamp_policy = "assume_utc_for_diagnostic_only" if naive else "reject"
          ledger, report = producer.run_end_to_end(
              rows,
              dataset_sha256=hashlib.sha256(payload).hexdigest(),
              source_uri=ci_benchmark.SOURCE,
              rule="last_return_sign",
              side="long",
              as_of_index=len(rows),
              naive_timestamp_policy=timestamp_policy,
              evidence_kind="real_market_research",
              license_reference=ci_benchmark.LICENSE,
              atlas_bootstrap_replicates=200,
          )
          checked = integrated.validate_forecast_ledger(ledger)
          probability_evolution_report = probability_evolution.evaluate_forecast_ledger_versions(
              ledger, candidate_expert="alpha_calibrated_logistic_v1", as_of_index=len(rows),
              score_partition="final_holdout",
          )
          baseline_advantage_report = baseline_advantage.evaluate_ledger(
              ledger, as_of_index=len(rows), score_partition="final_holdout", bootstrap_replicates=500,
          )
          baseline_refinement_report = baseline_refinement.evaluate_ledger(
              ledger, as_of_index=len(rows), score_partition="final_holdout", bootstrap_replicates=500,
          )
          legacy_v45 = baseline_advantage_report["versions"]["4.5"]
          reset_v01a = baseline_refinement_report["versions"]["0.1a"]
          assert baseline_refinement_report["score_cohort_sha256"] == baseline_advantage_report["score_cohort_sha256"], {
              "refinement_cohort": baseline_refinement_report["score_cohort_sha256"],
              "legacy_cohort": baseline_advantage_report["score_cohort_sha256"],
          }
          assert baseline_refinement_report["scored_rows"] == baseline_advantage_report["scored_rows"], {
              "refinement_rows": baseline_refinement_report["scored_rows"],
              "legacy_rows": baseline_advantage_report["scored_rows"],
          }
          assert baseline_refinement_report["prediction_hashes"]["0.1a"] == legacy_v45["prediction_manifest_sha256"], {
              "v0.1a_prediction_manifest": baseline_refinement_report["prediction_hashes"]["0.1a"],
              "legacy_v4.5_prediction_manifest": legacy_v45["prediction_manifest_sha256"],
          }
          assert reset_v01a["brier"] == legacy_v45["brier"], {"reset": reset_v01a["brier"], "legacy": legacy_v45["brier"]}
          assert reset_v01a["log_loss"] == legacy_v45["log_loss"], {"reset": reset_v01a["log_loss"], "legacy": legacy_v45["log_loss"]}
          print(json.dumps({"legacy_v4_5_to_v0_1a_exact_prediction_manifest": "PASS",
                            "legacy_v45_prediction_manifest_sha256": legacy_v45["prediction_manifest_sha256"],
                            "scored_rows": baseline_refinement_report["scored_rows"]}, sort_keys=True))
          assert baseline_refinement_report["version_order"] == list(baseline_refinement.VERSION_ORDER), baseline_refinement_report
          assert len(baseline_refinement_report["version_order"]) == 50, baseline_refinement_report
          assert baseline_refinement_report["version_order"][0] == "0.1a", baseline_refinement_report
          assert baseline_refinement_report["version_order"][-1] == "5.0a", baseline_refinement_report
          assert baseline_refinement_report["status"] == "BASELINE_GOVERNED_RESEARCH_ONLY", baseline_refinement_report
          assert baseline_refinement_report["protocol_version"] == "serevex-baseline-refinement-v5.0a.4", baseline_refinement_report
          assert baseline_refinement_report["prequential_governor"]["incremental_audit"]["calibration_cohort_matches_dual_score_gate"] is True, baseline_refinement_report
          assert baseline_refinement_report["prequential_governor"]["incremental_audit"]["prequential_maturity_window_reconciled"] is True, baseline_refinement_report
          assert baseline_refinement_report["prequential_governor"]["baseline_fallback_audit"]["fallback_probabilities_match_source_baseline_exactly"] is True, baseline_refinement_report
          assert baseline_refinement_report["validation"]["model_validated"] is False, baseline_refinement_report
          assert baseline_refinement_report["validation"]["deployment_calibrated"] is False, baseline_refinement_report
          assert baseline_refinement_report["validation"]["live_signal_enabled"] is False, baseline_refinement_report
          assert baseline_refinement_report["validation"]["live_order_execution_enabled"] is False, baseline_refinement_report
          assert baseline_refinement_report["multi_audit"]["bootstrap_estimand_alignment"]["brier_and_log_loss_share_resampled_block_indices"] is True, baseline_refinement_report
          assert baseline_refinement_report["multi_audit"]["bootstrap_estimand_alignment"]["full_cohort_and_bootstrap_estimands_can_differ_in_sign"] is True, baseline_refinement_report
          assert baseline_refinement_report["prequential_governor"]["baseline_reproduction_verified"] is True, baseline_refinement_report
          assert baseline_refinement_report["prequential_governor"]["same_scored_cohort_verified"] is True, baseline_refinement_report
          assert baseline_refinement_report["prequential_governor"]["future_label_used_for_own_decision"] is False, baseline_refinement_report
          assert baseline_refinement_report["validation"]["decision_output"] == "NO_TRADE", baseline_refinement_report
          assert baseline_refinement_report["scored_rows"] > 0, baseline_refinement_report
          eligible_count = len(rows) - producer.HORIZON_BARS - producer.WARMUP_BARS
          partition_ends = {
              "development": producer.WARMUP_BARS + int(eligible_count * 0.50),
              "model_selection": producer.WARMUP_BARS + int(eligible_count * 0.70),
              "calibration": producer.WARMUP_BARS + int(eligible_count * 0.80),
              "final_holdout": len(rows),
          }
          hierarchical_shrinkage_report = hierarchical_shrinkage.evaluate_ledger(
              ledger, as_of_index=len(rows), partition_end_indices=partition_ends,
              bootstrap_replicates=500,
          )
          assert hierarchical_shrinkage_report["candidate_grid"]["candidate_count"] == 18, hierarchical_shrinkage_report
          assert hierarchical_shrinkage_report["development_selection"]["selection_partition"] == "development", hierarchical_shrinkage_report
          assert hierarchical_shrinkage_report["development_selection"]["holdout_labels_used_for_selection"] is False, hierarchical_shrinkage_report
          assert hierarchical_shrinkage_report["development_selection"]["model_selection_labels_used_for_selection"] is False, hierarchical_shrinkage_report
          assert hierarchical_shrinkage_report["development_selection"]["calibration_labels_used_for_selection"] is False, hierarchical_shrinkage_report
          assert hierarchical_shrinkage_report["promotion"]["final_holdout_changes_candidate_choice"] is False, hierarchical_shrinkage_report
          assert hierarchical_shrinkage_report["decision_output"] == "NO_TRADE", hierarchical_shrinkage_report
          assert hierarchical_shrinkage_report["final_holdout"]["rows"] > 0, hierarchical_shrinkage_report
          hierarchical_shrinkage_v2_report = hierarchical_shrinkage_v2.evaluate_ledger(
              ledger, as_of_index=len(rows), partition_end_indices=partition_ends,
              bootstrap_replicates=500,
          )
          assert hierarchical_shrinkage_v2_report["candidate_grid"]["count"] == 48, hierarchical_shrinkage_v2_report
          assert hierarchical_shrinkage_v2_report["baseline_reproduction_audit"]["verified"] is True, hierarchical_shrinkage_v2_report
          assert hierarchical_shrinkage_v2_report["final_holdout"]["rows"] > 0, hierarchical_shrinkage_v2_report
          assert hierarchical_shrinkage_v2_report["final_holdout"]["policy"] in {"0.1b", "hierarchical_candidate"}, hierarchical_shrinkage_v2_report
          assert hierarchical_shrinkage_v2_report["decision_output"] == "NO_TRADE", hierarchical_shrinkage_v2_report
          assert hierarchical_shrinkage_v2_report["model_validated"] is False, hierarchical_shrinkage_v2_report
          assert hierarchical_shrinkage_v2_report["deployment_calibrated"] is False, hierarchical_shrinkage_v2_report
          assert hierarchical_shrinkage_v2_report["live_signal_enabled"] is False, hierarchical_shrinkage_v2_report
          assert hierarchical_shrinkage_v2_report["live_order_execution_enabled"] is False, hierarchical_shrinkage_v2_report
          assert baseline_advantage_report["version_order"] == list(baseline_advantage.VERSION_ORDER), baseline_advantage_report
          assert len(baseline_advantage_report["version_order"]) == 50, baseline_advantage_report
          assert baseline_advantage_report["version_order"][0] == "0.1", baseline_advantage_report
          assert baseline_advantage_report["version_order"][-1] == "5.0", baseline_advantage_report
          assert baseline_advantage_report["status"] == "BASELINE_GOVERNED_RESEARCH_ONLY", baseline_advantage_report
          assert baseline_advantage_report["prequential_governor"]["baseline_reproduction_verified"] is True, baseline_advantage_report
          assert baseline_advantage_report["prequential_governor"]["same_scored_cohort_verified"] is True, baseline_advantage_report
          assert baseline_advantage_report["prequential_governor"]["future_label_used_for_own_decision"] is False, baseline_advantage_report
          assert baseline_advantage_report["validation"]["decision_output"] == "NO_TRADE", baseline_advantage_report
          assert baseline_advantage_report["scored_rows"] > 0, baseline_advantage_report
          assert list(probability_evolution_report["versions"]) == list(probability_evolution.VERSION_ORDER), probability_evolution_report
          assert probability_evolution_report["status"] == "RESEARCH_COMPARISON_NOT_PROMOTION", probability_evolution_report
          assert probability_evolution_report["score_partition"] == "final_holdout", probability_evolution_report
          cohort_row_counts = {version: item["scored_rows"] for version, item in probability_evolution_report["comparison"].items()}
          assert len(set(cohort_row_counts.values())) == 1, cohort_row_counts
          assert next(iter(cohort_row_counts.values())) > 0, cohort_row_counts
          expected_forecast_identity = sorted(
              [(record["decision_id"], record["decision_index"]) for record in ledger["records"]],
              key=lambda identity: identity[1],
          )
          assert len(ledger["records"]) == len(probability_evolution_report["versions"]["9.0"]["forecasts"])
          for version, result in probability_evolution_report["versions"].items():
              evidence = result["evidence"]
              assert evidence["decision_output"] == "NO_TRADE", (version, evidence)
              assert evidence["model_validated"] is False, (version, evidence)
              assert evidence["deployment_calibrated"] is False, (version, evidence)
              assert evidence["score_partition"] == "final_holdout", (version, evidence)
              assert evidence["scored_rows"] == next(iter(cohort_row_counts.values())), (version, cohort_row_counts)
              assert evidence["forecast_rows_emitted"] == len(ledger["records"]), (version, evidence)
              assert evidence["rows_at_or_after_as_of_excluded"] == 0, (version, evidence)
              assert evidence["last_emitted_decision_index"] < len(rows), (version, evidence)
              actual_forecast_identity = [
                  (item["decision_id"], item["decision_index"]) for item in result["forecasts"]
              ]
              assert actual_forecast_identity == expected_forecast_identity, (version, "ledger_forecast_identity_mismatch")
              assert all(item["decision_index"] < len(rows) for item in result["forecasts"]), version
          assert probability_evolution_report["source_evidence"]["historical_feature_availability_verified"] is False
          alpha = ledger["metadata"]["alpha_model_training"]
          assert baseline_advantage_report["scored_rows"] == alpha["final_holdout_metrics"]["rows"], baseline_advantage_report
          assert abs(baseline_advantage_report["versions"]["0.1"]["brier"] - alpha["final_holdout_metrics"]["causal_baseline_brier_score"]) < 1e-12, (baseline_advantage_report, alpha)
          assert baseline_refinement_report["scored_rows"] == alpha["final_holdout_metrics"]["rows"], baseline_refinement_report
          assert abs(baseline_refinement_report["anchors"]["CAUSAL_BASELINE"]["brier"] - alpha["final_holdout_metrics"]["causal_baseline_brier_score"]) < 1e-12, (baseline_refinement_report, alpha)
          assert baseline_refinement_report["anchors"]["CAUSAL_BASELINE"]["rows"] == baseline_refinement_report["scored_rows"], baseline_refinement_report
          assert baseline_refinement_report["versions"]["5.0a"]["rows"] == baseline_refinement_report["scored_rows"], baseline_refinement_report
          assert checked["contract_status"] == "PASS", checked
          assert alpha["model_version"] == "serevex-alpha-logistic-v4-embargoed-dual-score-ood", alpha
          assert alpha["status"] == "ALPHA_RESEARCH_TRAINED", alpha
          assert alpha["training_policy"]["final_holdout_labels_used_for_fit_or_calibration"] is False, alpha
          assert alpha["training_policy"]["final_holdout_predictions_are_frozen"] is True, alpha
          assert alpha["final_holdout_metrics"]["rows"] > 0, alpha
          assert hierarchical_shrinkage_report["final_holdout"]["rows"] == alpha["final_holdout_metrics"]["rows"], hierarchical_shrinkage_report
          assert abs(hierarchical_shrinkage_report["final_holdout"]["baseline_metrics"]["brier"] - alpha["final_holdout_metrics"]["causal_baseline_brier_score"]) < 1e-12, (hierarchical_shrinkage_report, alpha)
          assert "probability_governor" in alpha, alpha
          assert alpha["probability_governor"]["alpha_weight"] in (0.0, 0.1, 0.25, 0.5, 0.75, 1.0), alpha
          assert "paired_brier_improvement_ci_vs_causal_baseline" in alpha["final_holdout_metrics"], alpha
          assert "reliability_diagnostics" in alpha["final_holdout_metrics"], alpha
          assert "out_of_domain_fallback_rate" in alpha["final_holdout_metrics"], alpha
          assert alpha["probability_governor"]["status"] in (
              "BASELINE_ONLY_INSUFFICIENT_CALIBRATION_SUPPORT",
              "BASELINE_ONLY_NO_CONFIRMED_DUAL_SCORE_GAIN",
              "CALIBRATION_BLOCK_SELECTED_ALPHA_WEIGHT_PASSES_DUAL_SCORE_STABILITY_SCREEN",
          ), alpha
          assert all("alpha_logistic_v1" in row["expert_probabilities"] for row in ledger["records"])
          assert all("alpha_calibrated_logistic_v1" in row["expert_probabilities"] for row in ledger["records"])
          assert all(
              (0.0 <= row["alpha_model_out_of_domain_fraction"] <= 1.0)
              if row["partition"] == "final_holdout"
              else row["alpha_model_out_of_domain_fraction"] is None
              for row in ledger["records"]
          )
          assert report["status"] == "PASS_CONTRACT_DIAGNOSTIC_ONLY", report
          assert report["stage_1_ledger_contract"] == "PASS", report
          assert report["decision_output"] == "NO_TRADE", report
          assert report["live_signal_enabled"] is False and report["live_order_execution_enabled"] is False, report
          assert checked["all_source_verification_flags_true"] is False, checked
          assert len(ledger["records"]) > 1000, checked
          mixer = report["stage_3_delayed_feedback_mixer"]
          assert mixer["status"] == "DIAGNOSTIC_ONLY", mixer
          assert mixer["scored_rows"] > 0, mixer
          assert mixer["rows_at_or_after_as_of_excluded"] == 0, mixer
          atlas = report["stage_2_predictability_atlas"]
          status_counts = dict(Counter(cell["status"] for cell in atlas["results"]))
          probability_evolution_final_global_gate = {}
          for version, result in probability_evolution_report["versions"].items():
              global_trace = [
                  item for item in result["policy_trace"] if item.get("pool") == "global"
              ]
              latest = global_trace[-1] if global_trace else {}
              probability_evolution_final_global_gate[version] = {
                  "decision_index": latest.get("decision_index"),
                  "status": latest.get("status"),
                  "confirmation_gate_status": latest.get("confirmation_gate_status"),
                  "selection_candidate_diagnostics": latest.get("selection_candidate_diagnostics", []),
              }
          summary = {
              "status": "PASS_REAL_DATA_LEDGER_AND_STAGES_1_3_CONTRACTS",
              "evidence_kind": ledger["metadata"]["evidence_kind"],
              "dataset_rows": len(rows),
              "dataset_sha256": ledger["metadata"]["dataset_sha256"],
              "source_uri": ledger["metadata"]["source_uri"],
              "rule": ledger["metadata"]["rule"],
              "side": ledger["metadata"]["side"],
              "target_id": ledger["metadata"]["target_id"],
              "timestamp_policy": ledger["metadata"]["source_timezone_policy"],
              "source_timestamp_semantics_verified": ledger["metadata"]["source_timestamp_semantics_verified"],
              "historical_feature_availability_verified": ledger["metadata"]["historical_feature_availability_verified"],
              "license_reference_claim": ledger["metadata"]["license_reference_claim"],
              "ledger_record_count": checked["record_count"],
              "ledger_sha256": checked["ledger_sha256"],
              "partition_counts": checked["partition_counts"],
