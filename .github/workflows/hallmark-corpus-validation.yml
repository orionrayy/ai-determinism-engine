name: Hallmark corpus validation

on:
  pull_request:
    paths:
      - "research/corpus/**"
      - "orchestrator/skill_runtime.py"
      - "orchestrator/test_skill_runtime.py"
      - ".github/workflows/hallmark-corpus-validation.yml"
      - "ORCHESTRATION_MEMORY.md"
  push:
    branches: [main]
    paths:
      - "research/corpus/**"
      - "orchestrator/skill_runtime.py"
      - "orchestrator/test_skill_runtime.py"
      - ".github/workflows/hallmark-corpus-validation.yml"
      - "ORCHESTRATION_MEMORY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hallmark-corpus-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus-contract:
    name: Validate corpus metadata and provenance gates
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile research pipeline
        run: python -m py_compile research/corpus/validate_corpus.py research/corpus/test_validate_corpus.py research/corpus/harvest_doaj_candidates.py research/corpus/test_harvest_doaj_candidates.py
      - name: Validate JSON metadata contracts
        run: |
          python -m json.tool research/corpus/manifest.schema.json >/dev/null
          python -m json.tool research/corpus/genre-taxonomy.json >/dev/null
          python -m json.tool research/corpus/source_registry.json >/dev/null
      - name: Run provenance and deduplication tests
        run: python -m unittest discover -s research/corpus -p "test_*.py" -v
      - name: Produce an honest baseline summary
        run: python research/corpus/validate_corpus.py research/corpus/manifest.jsonl --json > corpus-summary.json
      - name: Assert incomplete target is reported, not fabricated
        shell: bash
        run: |
          set +e
          python research/corpus/validate_corpus.py research/corpus/manifest.jsonl --target 500 --require-target
          code=$?
          set -e
          test "$code" -eq 3
