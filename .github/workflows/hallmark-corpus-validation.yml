name: Hallmark corpus validation

on:
  pull_request:
    paths:
      - "research/corpus/**"
      - "orchestrator/skill_runtime.py"
      - "orchestrator/test_skill_runtime.py"
      - ".github/workflows/hallmark-corpus-validation.yml"
      - "ORCHESTRATION_MEMORY.md"
  push:
    branches: [main]
    paths:
      - "research/corpus/**"
      - "orchestrator/skill_runtime.py"
      - "orchestrator/test_skill_runtime.py"
      - ".github/workflows/hallmark-corpus-validation.yml"
      - "ORCHESTRATION_MEMORY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hallmark-corpus-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus-contract:
    name: Validate corpus metadata and provenance gates
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile research pipeline
        run: python -m py_compile research/corpus/validate_corpus.py research/corpus/test_validate_corpus.py research/corpus/harvest_doaj_candidates.py research/corpus/test_harvest_doaj_candidates.py research/corpus/validate_features.py research/corpus/test_validate_features.py research/corpus/inspect_xlsx_structure.py research/corpus/test_inspect_xlsx_structure.py
      - name: Validate JSON metadata contracts
        run: |
          python -m json.tool research/corpus/manifest.schema.json >/dev/null
          python -m json.tool research/corpus/genre-taxonomy.json >/dev/null
          python -m json.tool research/corpus/source_registry.json >/dev/null
      - name: Run provenance and deduplication tests
        run: python -m unittest discover -s research/corpus -p "test_*.py" -v
      - name: Inspect pinned open-licensed XLSX reference (best-effort, bounded)
        shell: bash
        run: |
          python - <<'PY'
          import json, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, "research/corpus")
          from inspect_xlsx_structure import inspect_xlsx

          url = "https://raw.githubusercontent.com/BulyK47/battery-datasets/ec8f3f3bc0898bb440432cb11a434250d6bcbb0c/ocv-relaxation-24h/ocv_relaxation_24h.xlsx"
          license_url = "https://github.com/BulyK47/battery-datasets/blob/ec8f3f3bc0898bb440432cb11a434250d6bcbb0c/LICENSE"
          out = {"status": "unavailable", "source_url": url, "license_url": license_url,
                 "note": "A download/parse failure leaves the workbook as metadata-only; this step does not affect corpus eligibility."}
          path = Path("/tmp/ocv_relaxation_24h.xlsx")
          try:
              request = urllib.request.Request(url, headers={"User-Agent": "Hallmark-Corpus-Structure-Audit/1.0"})
              with urllib.request.urlopen(request, timeout=35) as response:
                  raw = response.read(2_000_001)
              if not raw:
                  raise ValueError("empty_download")
              if len(raw) > 2_000_000:
                  raise ValueError("download_exceeded_2MB_limit")
              path.write_bytes(raw)
              out = inspect_xlsx(path, max_bytes=2_000_000)
              out["source_url"] = url
              out["license_url"] = license_url
              out["method"] = "pinned raw GitHub download; stdlib OOXML structural inspection; cell values not emitted"
          except Exception as exc:
              out["status"] = "unavailable"
              out["failure_type"] = type(exc).__name__
              out["failure_detail"] = str(exc)[:240]
              print("WARNING: pinned workbook unavailable; keep manifest record metadata-only.")
          Path("battery-workbook-structure.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True) + chr(10), encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Produce an honest baseline summary
        run: python research/corpus/validate_corpus.py research/corpus/manifest.jsonl --json > corpus-summary.json
      - name: Validate structure-analysis traceability
        run: python research/corpus/validate_features.py research/corpus/manifest.jsonl research/corpus/features.jsonl --json > features-summary.json
      - name: Assert incomplete target is reported, not fabricated
        shell: bash
        run: |
          set +e
          python research/corpus/validate_corpus.py research/corpus/manifest.jsonl --target 500 --require-target
          code=$?
          set -e
          test "$code" -eq 3
      - name: Preserve machine-readable corpus inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hallmark-corpus-inventory-${{ github.sha }}
          path: |
            corpus-summary.json
            features-summary.json
            battery-workbook-structure.json
          if-no-files-found: warn
          retention-days: 14
