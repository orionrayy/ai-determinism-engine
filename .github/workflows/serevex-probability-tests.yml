name: Serevex Probability Method Tests

on:
  pull_request:
    paths:
      - "projects/aurum-intelligence/online-benchmark/serevex_alpha_model_v1.py"
      - "projects/aurum-intelligence/online-benchmark/test_serevex_alpha_model_v1.py"
      - "projects/aurum-intelligence/online-benchmark/serevex_forecast_ledger_producer_v1.py"
      - "projects/aurum-intelligence/online-benchmark/test_serevex_forecast_ledger_producer_v1.py"
      - "projects/aurum-intelligence/online-benchmark/serevex_stage123_integrated_v1.py"
      - "projects/aurum-intelligence/online-benchmark/test_serevex_stage123_integrated_v1.py"
      - "projects/aurum-intelligence/online-benchmark/serevex_probability_evolution_v4_v9.py"
      - "projects/aurum-intelligence/online-benchmark/test_serevex_probability_evolution_v4_v9.py"
      - "projects/aurum-intelligence/online-benchmark/serevex_baseline_advantage_v0_v5.py"
      - "projects/aurum-intelligence/online-benchmark/test_serevex_baseline_advantage_v0_v5.py"
      - "projects/aurum-intelligence/online-benchmark/serevex_hierarchical_shrinkage_v1.py"
      - "projects/aurum-intelligence/online-benchmark/test_serevex_hierarchical_shrinkage_v1.py"
      - "projects/aurum-intelligence/SEREVEX_BASELINE_ADVANTAGE_V0_V5.md"
      - "projects/aurum-intelligence/SEREVEX_PROBABILITY_EVOLUTION_V4_V9.md"
      - ".github/workflows/serevex-probability-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serevex-probability-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile probabilistic method modules
        working-directory: projects/aurum-intelligence/online-benchmark
        run: |
          python -m py_compile serevex_alpha_model_v1.py serevex_forecast_ledger_producer_v1.py serevex_stage123_integrated_v1.py serevex_probability_evolution_v4_v9.py test_serevex_probability_evolution_v4_v9.py serevex_baseline_advantage_v0_v5.py test_serevex_baseline_advantage_v0_v5.py serevex_hierarchical_shrinkage_v1.py test_serevex_hierarchical_shrinkage_v1.py
      - name: Test probabilistic method and integrated stage contracts
        working-directory: projects/aurum-intelligence/online-benchmark
        run: python -m unittest -v test_serevex_alpha_model_v1.py test_serevex_forecast_ledger_producer_v1.py test_serevex_stage123_integrated_v1.py test_serevex_probability_evolution_v4_v9.py test_serevex_baseline_advantage_v0_v5.py test_serevex_hierarchical_shrinkage_v1.py
