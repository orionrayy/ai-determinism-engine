name: Hallmark skill validation

on:
  pull_request:
    paths:
      - ".agents/skills/hallmark/**"
      - ".agents/skills/README.md"
      - ".agents/skills/catalog.json"
      - ".agents/skills/document-craft/**"
      - "orchestrator/skill_runtime.py"
      - "orchestrator/test_skill_runtime.py"
      - ".github/workflows/hallmark-skill-validation.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/hallmark/**"
      - ".agents/skills/README.md"
      - ".agents/skills/catalog.json"
      - ".agents/skills/document-craft/**"
      - "orchestrator/skill_runtime.py"
      - "orchestrator/test_skill_runtime.py"
      - ".github/workflows/hallmark-skill-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate imported Hallmark package
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate themes and reference links without installing
        run: node .agents/skills/hallmark/scripts/install.mjs --codex --dry-run
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test skill routing and authorization
        run: python -m unittest discover -s orchestrator -p "test_skill_runtime.py" -v
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in .agents/skills/hallmark/scripts/*.mjs; do
            node --check "$file"
          done
