name: SOL Sentinel Forward Paper

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Run one bounded cycle, halt, or resume paper mode"
        type: choice
        required: true
        default: run
        options:
          - run
          - status
          - halt
          - resume
      reason:
        description: "Required rationale for halt/resume; ignored for run"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sol-sentinel-forward-paper-state
  cancel-in-progress: false

jobs:
  forward-paper:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore persistent paper state
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: sol-sentinel-paper-state
          path: .paper-state
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run one bounded operation
        id: operation
        continue-on-error: true
        env:
          OPERATION: ${{ inputs.operation || 'run' }}
          OPERATOR_REASON: ${{ inputs.reason || '' }}
        run: |
          mkdir -p .paper-state/state forward-output
          set +e
          case "$OPERATION" in
            status)
              python projects/sol-sentinel/forward_paper.py \
                --db-path .paper-state/state/forward-paper.sqlite3 \
                --status --json
              ;;
            halt)
              python projects/sol-sentinel/forward_paper.py \
                --db-path .paper-state/state/forward-paper.sqlite3 \
                --halt --halt-reason "$OPERATOR_REASON" --json
              ;;
            resume)
              python projects/sol-sentinel/forward_paper.py \
                --db-path .paper-state/state/forward-paper.sqlite3 \
                --resume --resume-reason "$OPERATOR_REASON" --json
              ;;
            run)
              python projects/sol-sentinel/forward_paper.py \
                --db-path .paper-state/state/forward-paper.sqlite3 \
                --cycles 1 --interval-seconds 0 --json
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 2
              ;;
          esac > forward-output/result.json 2> forward-output/stderr.txt
          rc=$?
          echo "$rc" > forward-output/exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Publish operational summary
        if: always()
        env:
          PAPER_RESULT: forward-output/result.json
          PAPER_EXIT_CODE: forward-output/exit-code.txt
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path

          result_path = Path(os.environ["PAPER_RESULT"])
          exit_path = Path(os.environ["PAPER_EXIT_CODE"])
          try:
              exit_code = exit_path.read_text(encoding="utf-8").strip()
          except OSError:
              exit_code = "missing"
          try:
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              if isinstance(payload, list):
                  payload = payload[-1] if payload else {}
              if not isinstance(payload, dict):
                  payload = {}
          except (OSError, json.JSONDecodeError):
              payload = {}
          signal = payload.get("signal") if isinstance(payload.get("signal"), dict) else {}
          risk = payload.get("risk") if isinstance(payload.get("risk"), dict) else {}
          portfolio = payload.get("portfolio") if isinstance(payload.get("portfolio"), dict) else {}
          reconciliation = payload.get("reconciliation") if isinstance(payload.get("reconciliation"), dict) else {}
          print("## SOL Sentinel Forward Paper")
          print(f"- Event: `{os.environ.get('GITHUB_EVENT_NAME', 'unknown')}`")
          print(f"- Run: `{os.environ.get('GITHUB_RUN_ID', 'unknown')}`")
          print(f"- Ref: `{os.environ.get('GITHUB_REF', 'unknown')}`")
          print(f"- Commit: `{os.environ.get('GITHUB_SHA', 'unknown')}`")
          print(f"- Operation exit code: `{exit_code}`")
          print(f"- System: `{payload.get('system_status', 'NO_RESULT')}`")
          print(f"- Cycle: `{payload.get('cycle_id', 'n/a')}`")
          print(f"- Strategy: `{signal.get('decision', 'n/a')}` — {', '.join(signal.get('reasons', []))}")
          print(f"- Risk: `{risk.get('state', 'n/a')}`; new entries allowed: `{risk.get('allow_new_entries', 'n/a')}`")
          print(f"- Portfolio: cash IDR `{portfolio.get('cash_idr', 'n/a')}`; SOL `{portfolio.get('sol_quantity', 'n/a')}`")
          print(f"- Ledger reconciliation: `{reconciliation.get('consistent', 'n/a')}`; issues: `{len(reconciliation.get('issues', []))}`")
          PY
      - name: Checkpoint and verify SQLite state
        if: always()
        run: |
          if [ ! -f .paper-state/state/forward-paper.sqlite3 ]; then
            echo "Forward-paper SQLite state does not exist."
            exit 1
          fi
          python - .paper-state/state/forward-paper.sqlite3 <<'PY'
          import sqlite3, sys
          db=sqlite3.connect(sys.argv[1], timeout=15)
          try:
              db.execute("PRAGMA busy_timeout=15000")
              result=db.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()
              if result and result[0] != 0:
                  raise SystemExit("SQLite WAL checkpoint remained busy")
              integrity=db.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise SystemExit(f"SQLite integrity check failed: {integrity}")
          finally:
              db.close()
          PY
      - name: Persist paper state
        if: always()
        run: |
          git -C .paper-state config user.name "github-actions[bot]"
          git -C .paper-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .paper-state add state/forward-paper.sqlite3
          if ! git -C .paper-state diff --cached --quiet; then
            git -C .paper-state commit -m "checkpoint: forward-paper ${{ inputs.operation || 'run' }} ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            git -C .paper-state push origin HEAD:refs/heads/sol-sentinel-paper-state
          fi
      - name: Upload forward-paper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-sentinel-forward-paper-${{ github.run_id }}
          path: forward-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when operation was unsuccessful
        if: steps.operation.outputs.exit_code != '0'
        run: exit 1
