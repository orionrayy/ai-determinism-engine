name: SOL Sentinel Forward Paper

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Run one bounded cycle, halt, or resume paper mode"
        type: choice
        required: true
        default: run
        options:
          - run
          - status
          - halt
          - resume
      reason:
        description: "Required rationale for halt/resume; ignored for run"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sol-sentinel-forward-paper-state
  cancel-in-progress: false
  queue: max

jobs:
  forward-paper:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore persistent paper state
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: sol-sentinel-paper-state
          path: .paper-state
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run one bounded operation
        id: operation
        continue-on-error: true
        env:
          OPERATION: ${{ inputs.operation || 'run' }}
          OPERATOR_REASON: ${{ inputs.reason || '' }}
        run: |
          mkdir -p .paper-state/state forward-output
          set +e
          case "$OPERATION" in
            status)
              python projects/sol-sentinel/forward_paper.py \
                --db-path .paper-state/state/forward-paper.sqlite3 \
                --status --json
              ;;
            halt)
              python projects/sol-sentinel/forward_paper.py \
                --db-path .paper-state/state/forward-paper.sqlite3 \
                --halt --halt-reason "$OPERATOR_REASON" --json
              ;;
            resume)
              python projects/sol-sentinel/forward_paper.py \
                --db-path .paper-state/state/forward-paper.sqlite3 \
                --resume --resume-reason "$OPERATOR_REASON" --json
              ;;
            run)
              python projects/sol-sentinel/forward_paper.py \
                --db-path .paper-state/state/forward-paper.sqlite3 \
                --cycles 1 --interval-seconds 0 --json
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 2
              ;;
          esac > forward-output/result.json 2> forward-output/stderr.txt
          rc=$?
          echo "$rc" > forward-output/exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Checkpoint and verify SQLite state
        id: state_integrity
        if: always()
        run: |
          if [ ! -f .paper-state/state/forward-paper.sqlite3 ]; then
            echo "Forward-paper SQLite state does not exist."
            exit 1
          fi
          python - .paper-state/state/forward-paper.sqlite3 <<'PY'
          import sqlite3, sys
          db=sqlite3.connect(sys.argv[1], timeout=15)
          try:
              db.execute("PRAGMA busy_timeout=15000")
              result=db.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()
              if result and result[0] != 0:
                  raise SystemExit("SQLite WAL checkpoint remained busy")
              integrity=db.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise SystemExit(f"SQLite integrity check failed: {integrity}")
          finally:
              db.close()
          PY
      - name: Persist paper state
        id: persist_state
        if: always() && steps.state_integrity.outcome == 'success'
        run: |
          git -C .paper-state config user.name "github-actions[bot]"
          git -C .paper-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .paper-state add state/forward-paper.sqlite3
          if ! git -C .paper-state diff --cached --quiet; then
            git -C .paper-state commit -m "checkpoint: forward-paper ${{ inputs.operation || 'run' }} ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            git -C .paper-state push origin HEAD:refs/heads/sol-sentinel-paper-state
          fi
      - name: Fail when operation was unsuccessful
        if: steps.operation.outputs.exit_code != '0'
        run: exit 1
      - name: Capture durable operational status
        id: capture_status
        if: always()
        env:
          STATE_INTEGRITY: ${{ steps.state_integrity.outcome }}
          STATE_PERSISTENCE: ${{ steps.persist_state.outcome }}
        run: |
          if [ "$STATE_INTEGRITY" = "success" ] && [ -f .paper-state/state/forward-paper.sqlite3 ]; then
            python projects/sol-sentinel/forward_paper.py \
              --db-path .paper-state/state/forward-paper.sqlite3 \
              --status --json > forward-output/status.json
          else
            python - <<'PY' > forward-output/status.json
          import json, os
          print(json.dumps({
              "system_status": "STATE_INTEGRITY_FAILED",
              "state_integrity": {"outcome": os.environ.get("STATE_INTEGRITY", "unknown")},
              "state_persistence": {"outcome": os.environ.get("STATE_PERSISTENCE", "unknown")},
              "ledger": {"consistent": False},
              "warning": "SQLite checkpoint/integrity validation did not pass; the state database was not persisted. Inspect this run before any further state transition."
          }, sort_keys=True))
          PY
          fi
      - name: Upload forward-paper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-sentinel-forward-paper-${{ github.run_id }}
          path: forward-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish operational summary
        if: always()
        env:
          PAPER_RESULT: forward-output/result.json
          PAPER_STATUS: forward-output/status.json
          PAPER_EXIT_CODE: forward-output/exit-code.txt
          PAPER_STDERR: forward-output/stderr.txt
          STATE_INTEGRITY: ${{ steps.state_integrity.outcome }}
          STATE_PERSISTENCE: ${{ steps.persist_state.outcome }}
          STATUS_CAPTURE: ${{ steps.capture_status.outcome }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path

          def read_json(name):
              try:
                  value = json.loads(Path(os.environ[name]).read_text(encoding="utf-8"))
                  if isinstance(value, list):
                      value = value[-1] if value else {}
                  return value if isinstance(value, dict) else {}
              except (OSError, json.JSONDecodeError):
                  return {}

          try:
              exit_code = Path(os.environ["PAPER_EXIT_CODE"]).read_text(encoding="utf-8").strip()
          except OSError:
              exit_code = "missing"
          try:
              stderr_lines = Path(os.environ["PAPER_STDERR"]).read_text(encoding="utf-8").splitlines()
              stderr_tail = stderr_lines[-1][-500:] if stderr_lines else ""
          except OSError:
              stderr_tail = ""

          result = read_json("PAPER_RESULT")
          status = read_json("PAPER_STATUS")
          signal = result.get("signal") if isinstance(result.get("signal"), dict) else {}
          risk = result.get("risk") if isinstance(result.get("risk"), dict) else {}
          portfolio = status.get("portfolio") if isinstance(status.get("portfolio"), dict) else result.get("portfolio", {})
          control = status.get("control") if isinstance(status.get("control"), dict) else {}
          fw = status.get("forward_state") if isinstance(status.get("forward_state"), dict) else {}
          cycle = fw.get("last_cycle") if isinstance(fw.get("last_cycle"), dict) else {}
          daily = fw.get("latest_daily_risk") if isinstance(fw.get("latest_daily_risk"), dict) else {}
          ledger = status.get("ledger") if isinstance(status.get("ledger"), dict) else result.get("reconciliation", {})
          orders = status.get("open_orders") if isinstance(status.get("open_orders"), list) else []
          position = status.get("position")
          micro = status.get("microstructure") if isinstance(status.get("microstructure"), dict) else result.get("microstructure_summary", {})
          last_error = cycle.get("error") or result.get("error") or stderr_tail or "none"
          run_status = status.get("system_status", result.get("system_status", "NO_RESULT"))
          circuit = daily.get("risk_state") or control.get("operating_state") or risk.get("state", "unknown")

          print("## SOL Sentinel Forward Paper")
          print(f"- Event / run: `{os.environ.get('GITHUB_EVENT_NAME', 'unknown')}` / `{os.environ.get('GITHUB_RUN_ID', 'unknown')}`")
          print(f"- Ref / main commit: `{os.environ.get('GITHUB_REF', 'unknown')}` / `{os.environ.get('GITHUB_SHA', 'unknown')}`")
          print(f"- Operation exit: `{exit_code}`; system: `{run_status}`; last error: `{last_error}`")
          print(f"- State integrity / persistence / status capture: `{os.environ.get('STATE_INTEGRITY', 'unknown')}` / `{os.environ.get('STATE_PERSISTENCE', 'unknown')}` / `{os.environ.get('STATUS_CAPTURE', 'unknown')}`")
          print(f"- Cycle: `{result.get('cycle_id', cycle.get('cycle_id', 'n/a'))}`; last completion: `{cycle.get('completed_at', 'n/a')}`; last cycle status: `{cycle.get('status', 'n/a')}`")
          print(f"- Last depth observation: `{micro.get('last_observed_at_utc', 'n/a')}`; snapshots: `{micro.get('observation_count', 'n/a')}`")
          print(f"- Strategy: `{signal.get('decision', 'n/a')}`; reasons: {', '.join(signal.get('reasons', [])) or 'none'}")
          print(f"- Circuit breaker / entries: `{circuit}` / `{risk.get('allow_new_entries', 'n/a')}`; daily loss fraction: `{daily.get('daily_loss_fraction', risk.get('daily_loss_fraction', 'n/a'))}`; drawdown: `{daily.get('drawdown_fraction', risk.get('drawdown_fraction', 'n/a'))}`")
          print(f"- Portfolio: cash IDR `{portfolio.get('cash_idr', 'n/a')}`; SOL `{portfolio.get('sol_quantity', 'n/a')}`; realized P&L IDR `{portfolio.get('realized_pnl_idr', 'n/a')}`; fees IDR `{portfolio.get('fees_paid_idr', 'n/a')}`")
          print(f"- Position: `{json.dumps(position, ensure_ascii=False, default=str) if position else 'flat / none'}`")
          print(f"- Open simulated orders: `{len(orders)}`; remaining quantities: `{', '.join(str(x.get('remaining_qty', 'n/a')) for x in orders) or 'none'}`")
          print(f"- Ledger: consistent `{ledger.get('consistent', 'n/a')}`; events/fills/orders `{ledger.get('event_count', 'n/a')}/{ledger.get('fill_count', 'n/a')}/{ledger.get('order_count', 'n/a')}`; recovery consistent `{result.get('recovery', {}).get('consistent', ledger.get('consistent', 'n/a')) if isinstance(result.get('recovery'), dict) else ledger.get('consistent', 'n/a')}`")
          if (exit_code != "0" or run_status in ("MANUAL_REVIEW_REQUIRED", "HALTED")
              or ledger.get("consistent") is False
              or os.environ.get("STATE_INTEGRITY") != "success"
              or os.environ.get("STATE_PERSISTENCE") != "success"
              or os.environ.get("STATUS_CAPTURE") != "success"):
              print("- **ACTION REQUIRED:** inspect this run's result.json, status.json and job logs before allowing further state transitions.")
          PY
