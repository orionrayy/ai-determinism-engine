name: SOL Sentinel Research

on:
  push:
    branches:
      - feat/sol-sentinel-paper-trader-v1
    paths:
      - ".github/workflows/sol-sentinel-research.yml"
  workflow_dispatch:
    inputs:
      days:
        description: Number of recent days for public SOLUSDT 1m research data (3 days is a smoke test; 7+ is preferred for evaluation)
        required: true
        type: choice
        options:
          - "3"
          - "7"
          - "14"
          - "30"
        default: "7"
  schedule:
    - cron: "15 14 * * *"

permissions:
  contents: read

concurrency:
  group: sol-sentinel-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAPTURE_DAYS: ${{ inputs.days || '7' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and test
        run: |
          python -m py_compile projects/sol-sentinel/sol_sentinel.py projects/sol-sentinel/capture_history.py projects/sol-sentinel/paper_engine.py projects/sol-sentinel/evaluate_splits.py
          python -m unittest discover -s projects/sol-sentinel -p 'test_*.py' -v

      - name: Capture public historical candles
        run: |
          mkdir -p research-output
          python projects/sol-sentinel/capture_history.py \
            --symbol SOLUSDT --interval 1m --days "$CAPTURE_DAYS" \
            --output research-output/SOLUSDT_1m.csv

      - name: Run cost-aware offline backtest
        run: |
          python projects/sol-sentinel/paper_engine.py \
            --csv research-output/SOLUSDT_1m.csv \
            --report-path research-output/backtest.json \
            --db-path ""

      - name: Evaluate fixed strategy on chronological splits
        run: |
          python projects/sol-sentinel/evaluate_splits.py \
            --csv research-output/SOLUSDT_1m.csv \
            --output research-output/evaluation.json

      - name: Publish research summary
        if: always()
        run: |
          {
            echo "## SOL Sentinel research"
            echo
            echo "- Run mode: historical capture + offline evaluation only"
            echo "- Live order placement: disabled"
            echo "- Requested window: ${CAPTURE_DAYS} day(s)"
            echo
            if [ -f research-output/backtest.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("research-output/backtest.json").read_text())
          for key in ("period_start","period_end","bars_1m","initial_equity_idr","final_equity_idr","net_pnl_idr","net_return_pct","closed_trades","win_rate_pct","profit_factor","max_drawdown_pct","total_fees_idr"):
              print(f"- {key}: {data.get(key)}")
          print("- mode:", data.get("mode"))
          print("- execution_enabled:", data.get("execution_enabled"))
          PY
            else
              echo "Backtest report not available; inspect the failed step."
            fi
            if [ -f research-output/evaluation.json ]; then
              echo
              echo "Chronological evaluation report generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-sentinel-research-${{ github.run_id }}
          path: research-output/
          if-no-files-found: warn
          retention-days: 7
