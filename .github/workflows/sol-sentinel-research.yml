name: SOL Sentinel Research

on:
  push:
    branches:
      - feat/sol-sentinel-paper-trader-v1
    paths:
      - ".github/workflows/sol-sentinel-research.yml"
  workflow_dispatch:
    inputs:
      days:
        description: Number of recent days for public SOLUSDT 1m research data (3 days is a smoke test; 7+ is preferred for evaluation)
        required: true
        type: choice
        options:
          - "3"
          - "7"
          - "14"
          - "30"
        default: "30"
  schedule:
    - cron: "15 14 * * *"

permissions:
  contents: read

concurrency:
  group: sol-sentinel-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAPTURE_DAYS: ${{ inputs.days || '30' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and test
        run: |
          python -m py_compile projects/sol-sentinel/sol_sentinel.py projects/sol-sentinel/capture_history.py projects/sol-sentinel/paper_engine.py projects/sol-sentinel/evaluate_splits.py projects/sol-sentinel/cost_sensitivity.py projects/sol-sentinel/reku_market.py
          python -m unittest discover -s projects/sol-sentinel -p 'test_*.py' -v

      - name: Capture public history and dated FX reference (bounded retries)
        run: |
          mkdir -p research-output
          python projects/sol-sentinel/capture_history.py \
            --symbol SOLUSDT --interval 1m --days "$CAPTURE_DAYS" \
            --output research-output/SOLUSDT_1m.csv

      - name: Capture read-only Reku SOL/IDR market snapshot (order-book fallback)
        continue-on-error: true
        run: |
          python projects/sol-sentinel/reku_market.py \
            --symbol SOL \
            --binance-csv research-output/SOLUSDT_1m.csv \
            --output research-output/reku_sol_idr_market.json

      - name: Run cost-aware offline backtest
        run: |
          python projects/sol-sentinel/paper_engine.py \
            --csv research-output/SOLUSDT_1m.csv \
            --report-path research-output/backtest.json \
            --db-path ""

      - name: Evaluate fixed strategy on chronological splits
        run: |
          python projects/sol-sentinel/evaluate_splits.py \
            --csv research-output/SOLUSDT_1m.csv \
            --output research-output/evaluation.json

      - name: Compare predeclared execution-cost scenarios
        run: |
          python projects/sol-sentinel/cost_sensitivity.py \
            --csv research-output/SOLUSDT_1m.csv \
            --output research-output/cost_sensitivity.json

      - name: Publish research summary
        if: always()
        run: |
          {
            echo "## SOL Sentinel research"
            echo
            echo "- Run mode: historical capture + offline evaluation only"
            echo "- Live order placement: disabled"
            echo "- Requested window: ${CAPTURE_DAYS} day(s)"
            echo
            if [ -f research-output/backtest.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("research-output/backtest.json").read_text())
          for key in ("period_start","period_end","bars_1m","initial_equity_idr","final_equity_idr","net_pnl_idr","net_return_pct","signal_evaluations","signal_candidates","signal_rejection_counts","closed_trades","win_rate_pct","profit_factor","max_drawdown_pct","total_fees_idr","total_execution_friction_idr"):
              print(f"- {key}: {data.get(key)}")
          print("- mode:", data.get("mode"))
          print("- execution_enabled:", data.get("execution_enabled"))
          if not data.get("closed_trades"):
              print("- interpretation: NO TRADES — no profitability evidence; review signal rejections and costs.")
          PY
            else
              echo "Backtest report not available; inspect the failed step."
            fi
            if [ -f research-output/evaluation.json ]; then
              echo
              python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("research-output/evaluation.json").read_text())
          print("Chronological evaluation (fixed parameters; independent equity per segment):")
          for name, metrics in report.get("segments", {}).items():
              print(f"- {name}: bars={metrics.get('bars_1m')}, signals={metrics.get('signal_evaluations')}, candidates={metrics.get('signal_candidates')}, trades={metrics.get('closed_trades')}, net_pnl_idr={metrics.get('net_pnl_idr')}, max_drawdown_pct={metrics.get('max_drawdown_pct')}")
              print(f"  rejection_counts={metrics.get('signal_rejection_counts')}")
          PY
            fi
            if [ -f research-output/cost_sensitivity.json ]; then
              echo
              python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("research-output/cost_sensitivity.json").read_text())
          print("Cost sensitivity (predeclared; not auto-optimized):")
          for item in report.get("scenarios", []):
              print(f"- {item['scenario']}: cost_bps={item['modeled_round_trip_cost_bps']}, min_gross_bps={item['minimum_gross_move_bps_in_signal_gate']}, candidates={item['signal_candidates']}, trades={item['closed_trades']}, net_pnl_idr={item['net_pnl_idr']}, return_pct={item['net_return_pct']}, win_rate_pct={item['win_rate_pct']}, profit_factor={item['profit_factor']}")
              print(f"  fees_idr={item['total_fees_idr']}, execution_friction_idr={item['total_execution_friction_idr']}")
              print(f"  rejection_counts={item['signal_rejection_counts']}")
          PY
            fi

            if [ -f research-output/reku_sol_idr_market.json ]; then
              echo
              python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("research-output/reku_sol_idr_market.json").read_text())
          print("Reku public SOL/IDR market snapshot (read-only):")
          print("- status:", report.get("data_status"))
          print("- last_price_idr:", report.get("last_price_idr"))
          print("- direct_spread_bps:", (report.get("direct_bidask") or {}).get("spread_bps"))
          print("- orderbook_status:", report.get("orderbook_status"))
          print("- orderbook_endpoint_used:", report.get("orderbook_endpoint_used"))
          print("- orderbook_spread_bps:", (report.get("orderbook") or {}).get("spread_bps"))
          print("- cross_venue_comparison:", report.get("cross_venue_comparison"))
          print("- warnings:", report.get("warnings", []))
          print("- error:", report.get("error") or report.get("cross_venue_comparison_error") or report.get("orderbook_error"))
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-sentinel-research-${{ github.run_id }}
          path: research-output/
          if-no-files-found: warn
          retention-days: 7
