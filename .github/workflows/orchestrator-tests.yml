name: Orchestrator Tests

on:
  push:
    branches:
      - main
    paths:
      - "orchestrator/**"
      - "render.yaml"
      - "bridge_server.py"
      - "vercel.json"
      - "test_bridge_runtime.py"
      - "api/bridge.py"
      - "bridge_runtime.py"
      - "ORCHESTRATION_MEMORY.md"
      - "gateway.py"
      - "bridge_server.py"
      - "test_gateway.py"
      - ".github/workflows/orchestrator-tests.yml"
      - ".github/actionlint.yaml"
      - ".github/workflows/orchestrator-agent-federation.yml"
      - "orchestrator/test_aggregate_agent_results.py"
      - "orchestrator/test_agent_protocol.py"
      - "orchestrator/agent_protocol.py"
      - "orchestrator/aggregate_agent_results.py"
      - "orchestrator/agent_worker.py"
      - ".github/workflows/orchestrator-continuation.yml"
      - ".github/workflows/orchestrator.yml"
      - ".github/workflows/bridge-deploy.yml"
      - "test_actions_config.py"
      - ".orchestrator/state.json"
  pull_request:
    paths:
      - ".github/workflows/orchestrator.yml"
      - ".github/workflows/orchestrator-continuation.yml"
      - ".github/workflows/orchestrator-approval.yml"
      - ".github/actionlint.yaml"
      - "orchestrator/**"
      - ".github/workflows/bridge-deploy.yml"
      - "gateway.py"
      - "bridge_runtime.py"
      - "bridge_server.py"
      - "test_gateway.py"
      - "ORCHESTRATION_MEMORY.md"
      - ".github/workflows/orchestrator-tests.yml"
      - ".github/workflows/orchestrator-agent-federation.yml"
      - "test_actions_config.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestrator-tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Health state is derived from STATE_DIR for isolated test/workflow execution.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile orchestrator/aggregate_agent_results.py orchestrator/agent_worker.py
        run: python -m py_compile orchestrator/blueprint_compiler.py orchestrator/context_budget.py orchestrator/federation_scheduler.py orchestrator/agent_protocol.py orchestrator/agent_fabric.py orchestrator/orchestrator.py orchestrator/capability_graph.py orchestrator/llm_planner.py orchestrator/research_bundle.py orchestrator/evidence.py orchestrator/evidence_records.py orchestrator/epistemic_validation.py orchestrator/research_providers.py orchestrator/failure_policy.py orchestrator/http_safety.py orchestrator/plan_integrity.py orchestrator/state_schema.py orchestrator/checkpoint_integrity.py orchestrator/durability_barrier.py orchestrator/test_durability_barrier.py orchestrator/test_orchestrator.py orchestrator/test_evidence.py orchestrator/test_evidence_records.py orchestrator/test_epistemic_validation.py orchestrator/test_research_bundle.py orchestrator/test_research_providers.py orchestrator/test_failure_policy.py orchestrator/test_plan_integrity.py orchestrator/test_state_schema.py orchestrator/test_checkpoint_integrity.py orchestrator/issue_notify.py orchestrator/connector_bridge.py orchestrator/test_connector_bridge.py bridge_runtime.py bridge_server.py api/bridge.py test_bridge_runtime.py gateway.py test_gateway.py test_actions_config.py
      - name: Actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          actual_sha256="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"
          tar -xzf "/tmp/${archive}" -C /tmp
          /tmp/actionlint -color

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Unit tests
        run: python -m unittest discover -s orchestrator -p "test_*.py" -v && python -m unittest test_gateway test_bridge_runtime test_actions_config -v
      - name: Control-plane evaluation harness
        env:
          ORCHESTRATOR_FREE_ONLY: "true"
        run: python -m orchestrator.eval_harness --json
      - name: Validate private-input Worker
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/private-input/src/index.js
          node --check workers/private-input/src/private_input_object.js
          npx --yes wrangler@4.146.0 deploy --config workers/private-input/wrangler.jsonc --dry-run