name: Orchestrator Tests

on:
  push:
    paths:
      - "orchestrator/**"
      - "ORCHESTRATION_MEMORY.md"
      - "gateway.py"
      - "test_gateway.py"
      - ".github/workflows/orchestrator-tests.yml"
      - ".github/workflows/orchestrator-continuation.yml"
      - ".github/workflows/orchestrator.yml"
  pull_request:
    paths:
      - "orchestrator/**"
      - "gateway.py"
      - "test_gateway.py"
      - ".github/workflows/orchestrator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile orchestrator/orchestrator.py orchestrator/llm_planner.py orchestrator/research_bundle.py orchestrator/test_orchestrator.py orchestrator/test_research_bundle.py orchestrator/issue_notify.py gateway.py test_gateway.py test_actions_config.py
      - name: Unit tests
        run: python -m unittest discover -s orchestrator -p "test_*.py" -v && python -m unittest test_gateway test_actions_config -v
