name: Orchestrator Tests

on:
  push:
    paths:
      - "orchestrator/**"
      - "render.yaml"
      - "bridge_server.py"
      - "vercel.json"
      - "test_bridge_runtime.py"
      - "api/bridge.py"
      - "bridge_runtime.py"
      - "ORCHESTRATION_MEMORY.md"
      - "gateway.py"
      - "test_gateway.py"
      - ".github/workflows/orchestrator-tests.yml"
      - ".github/workflows/orchestrator-continuation.yml"
      - ".github/workflows/orchestrator.yml"
      - ".github/workflows/bridge-deploy.yml"
      - ".orchestrator/state.json"
  pull_request:
    paths:
      - "orchestrator/**"
      - ".github/workflows/bridge-deploy.yml"
      - "gateway.py"
      - "test_gateway.py"
      - "ORCHESTRATION_MEMORY.md"
      - ".github/workflows/orchestrator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile orchestrator/agent_protocol.py orchestrator/agent_fabric.py orchestrator/orchestrator.py orchestrator/capability_graph.py orchestrator/llm_planner.py orchestrator/research_bundle.py orchestrator/evidence.py orchestrator/failure_policy.py orchestrator/plan_integrity.py orchestrator/state_schema.py orchestrator/checkpoint_integrity.py orchestrator/durability_barrier.py orchestrator/test_durability_barrier.py orchestrator/test_orchestrator.py orchestrator/test_evidence.py orchestrator/test_research_bundle.py orchestrator/test_failure_policy.py orchestrator/test_plan_integrity.py orchestrator/test_state_schema.py orchestrator/test_checkpoint_integrity.py orchestrator/issue_notify.py orchestrator/connector_bridge.py orchestrator/test_connector_bridge.py bridge_runtime.py bridge_server.py api/bridge.py test_bridge_runtime.py gateway.py test_gateway.py test_actions_config.py
      - name: Actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          actual_sha256="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"
          tar -xzf "/tmp/${archive}" -C /tmp
          /tmp/actionlint -color

      - name: Unit tests
        run: python -m unittest discover -s orchestrator -p "test_*.py" -v && python -m unittest test_gateway test_actions_config -v