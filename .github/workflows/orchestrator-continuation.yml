name: Orchestrator Continuation

on:
  workflow_run:
    workflows: ["AI Orchestrator"]
    types: [completed]

concurrency:
  group: orchestrator-continuation-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  continue:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main

      - name: Decide continuation
        id: decision
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from orchestrator.orchestrator import load_state
          state=load_state()
          run_id=str(os.environ['WORKFLOW_RUN_ID'])
          run_attempt=str(os.environ['WORKFLOW_RUN_ATTEMPT'])
          wf=next((
              (
                  item for item in state.get('workflows',{}).values()
                  if str(item.get('github_run_id')) == run_id
                  and str(item.get('github_run_attempt')) == run_attempt
              ),
              None,
          )
          status=wf.get('status') if wf else 'missing'
          wid=wf.get('id') if wf else ''
          print(f'workflow_id={wid}')
          print('continue=' + ('true' if status == 'running' else 'false'))
          print(f'trigger_issue={wf.get("trigger_issue","") if wf else ""}')
          print(f'status={status}')
          PY

      - name: Dispatch continuation
        if: steps.decision.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ steps.decision.outputs.workflow_id }}
          TRIGGER_ISSUE: ${{ steps.decision.outputs.trigger_issue }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          payload=json.dumps({
            'event_type':'orchestrator.continue',
            'client_payload':{
              'workflow_id':os.environ['WORKFLOW_ID'],
              'event_id':f"continuation:{os.environ['WORKFLOW_RUN_ID']}:{os.environ['WORKFLOW_RUN_ATTEMPT']}",
              'trigger_issue':os.environ.get('TRIGGER_ISSUE') or '',
            },
          })
          subprocess.run(
            ['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/dispatches",'--input','-'],
            input=payload, text=True, check=True
          )
          PY

      - name: Summary
        run: |
          printf '%s\n' \
            "Continuation decision: ${{ steps.decision.outputs.continue }}" \
            "Workflow: ${{ steps.decision.outputs.workflow_id }}" \
            "Status: ${{ steps.decision.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
