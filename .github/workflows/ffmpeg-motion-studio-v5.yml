name: FFmpeg Motion Studio v5 — render and audio QC
on:
  push:
    branches:
      - feature/ffmpeg-motion-studio-v5
    paths:
      - 'projects/ffmpeg-motion-studio-v5/**'
      - '.github/workflows/ffmpeg-motion-studio-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-and-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free-first requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          python -m pip install --upgrade pip pillow
      - name: Expand versioned source bundle
        run: |
          base64 -d projects/ffmpeg-motion-studio-v5/source_bundle.b64 > projects/ffmpeg-motion-studio-v5/source_bundle.zip
          unzip -t projects/ffmpeg-motion-studio-v5/source_bundle.zip
          unzip -o projects/ffmpeg-motion-studio-v5/source_bundle.zip -d projects/
      - name: Run unit and pipeline-contract tests
        working-directory: projects/ffmpeg-motion-studio-v5
        run: python -m unittest -v test_pipeline.py
      - name: Render, download existing Indonesian voice, and mux audio
        working-directory: projects/ffmpeg-motion-studio-v5
        run: python pipeline.py --output ffmpeg-motion-studio-v5-preview.mp4
      - name: Validate final video and audio streams
        working-directory: projects/ffmpeg-motion-studio-v5
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels,duration -of json ffmpeg-motion-studio-v5-preview.mp4 > ffprobe-final.json
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=nw=1:nk=1 ffmpeg-motion-studio-v5-preview.mp4)" = audio
          python - <<'PY'
          import json
          x=json.load(open('ffprobe-final.json'))
          v=next(s for s in x['streams'] if s['codec_type']=='video')
          a=next(s for s in x['streams'] if s['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'],v['r_frame_rate'])==('h264',1920,1080,'24/1'),v
          assert (a['codec_name'],int(a['sample_rate']))==('aac',48000),a
          assert abs(float(x['format']['duration'])-41.75)<0.12,x['format']
          print('FINAL_STREAM_QC_PASS',x)
          PY
          zip -r ffmpeg-motion-studio-v5-source.zip README.md motion_core.py character_rig.py scene_renderer.py renderer_v5.py pipeline.py test_pipeline.py narration-preview.srt voiceover-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-motion-studio-v5-preview
          path: |
            projects/ffmpeg-motion-studio-v5/ffmpeg-motion-studio-v5-preview.mp4
            projects/ffmpeg-motion-studio-v5/ffmpeg-motion-studio-v5-contact-sheet.png
            projects/ffmpeg-motion-studio-v5/v5-validation-report.json
            projects/ffmpeg-motion-studio-v5/v5-render-report.json
            projects/ffmpeg-motion-studio-v5/narration.wav
            projects/ffmpeg-motion-studio-v5/ffprobe-final.json
            projects/ffmpeg-motion-studio-v5/ffmpeg-motion-studio-v5-source.zip
          if-no-files-found: error
          retention-days: 7
